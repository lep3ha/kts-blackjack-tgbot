services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_service
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_service"]
      interval: 2s
      timeout: 3s
      retries: 30

  game:
    image: kts-blackjack-tgbot-game:local
    build:
      context: .
      dockerfile: Dockerfile
      target: game-runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: game_service
      HOST: 0.0.0.0
      PORT: 8001
      DEBUG: 1
    ports:
      - "8001:8001"
    command: ["sh", "-c", "{ python -m alembic upgrade head && python run.py; } >> /var/log/kts-blackjack/game.log 2>&1"]
    volumes:
      - service_logs:/var/log/kts-blackjack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rpk topic create telegram.updates.raw --brokers=redpanda:9092 || \
        rpk topic describe telegram.updates.raw --brokers=redpanda:9092

  poller:
    image: kts-blackjack-tgbot-poller:local
    build:
      context: .
      dockerfile: Dockerfile
      target: poller-runtime
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    env_file:
      - ./poller/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OFFSET_STATE_PATH: /opt/service/var/state/offset.json
    volumes:
      - poller_state:/opt/service/var/state
      - service_logs:/var/log/kts-blackjack
    command: ["sh", "-c", "python run.py >> /var/log/kts-blackjack/poller.log 2>&1"]
    restart: unless-stopped
    init: true

  orchestrator:
    image: kts-blackjack-tgbot-orchestrator:local
    build:
      context: .
      dockerfile: Dockerfile
      target: orchestrator-runtime
    depends_on:
      game:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    env_file:
      - ./orchestrator/.env
    environment:
      GAME_SERVICE_BASE_URL: http://game:8001
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_AUTO_OFFSET_RESET: earliest
    volumes:
      - service_logs:/var/log/kts-blackjack
    command: ["sh", "-c", "python run.py >> /var/log/kts-blackjack/orchestrator.log 2>&1"]
    restart: unless-stopped
    stop_signal: SIGTERM
    init: true

volumes:
  db_data:
  poller_state:
  service_logs:
